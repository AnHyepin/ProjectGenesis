<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout-test/layout}">
<head>
  <link rel="stylesheet" href="/static/css/hyepin/resume-matchingList.css"/>
  <link rel="stylesheet" href="/static/css/hyepin/resume-applicaion-resumeApply.css"/>
  <title>Title</title>
</head>
<body layout:fragment="content">
<div class="detail-container" style="display: flex; flex-direction: column; gap: 10px;">
  <input type="hidden" name="sessionUsername" id="sessionUsername" th:value="${session.user.getUsername}">

  <div style="display: flex; align-items: center;margin-top: 10px;"><h2>지원 이력서 목록</h2></div>
  <hr style="border: 1px solid #4e4e4e; margin-top: 5px; margin-bottom: 0px;">
  <div>
    <th:block th:each="resume : ${resumeList}">
      <input type="hidden" name="resumeNo" id="resumeNo" th:value="${resume.resumeNo}">
      <input type="hidden" name="resumeNo" id="applicationNo" th:value="${resume.applicationNo}">
        <div style="display: flex; justify-content: space-between">
              <div style="display: flex; gap: 30px; padding: 20px;">

                      <div style="width: 100px; height: 100px; display: flex; align-items: center;">
                        <th:block th:if="${resume.fileUrl == null}">
                          <img src="/static/upload/20241230094808802.jpg" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;  border-radius: 50%; object-fit: cover;">
                        </th:block>
                        <th:block th:if="${resume.fileUrl != null}">
                          <img th:src="${resume.fileUrl}" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;  border-radius: 50%; object-fit: cover;">
                        </th:block>
                      </div>

                      <div style="display: flex; flex-direction: column; justify-content: center; gap: 10px;">
                          <div style="font-size: 16px; display: flex; gap: 5px;"><i class="bi bi-megaphone"></i>
                              <a th:href="@{/application/detail/{applicationNo}(applicationNo=${resume.applicationNo})}">[[${resume.applicationTitle}]]</a>
                          </div>
                          <div style="display: flex; gap: 10px; align-items: baseline;">
                              <a th:href="@{/resume/detail(resumeNo=${resume.resumeNo})}">
                                <span style="font-size: 20px; font-weight: bold;"> [[${resume.resumeTitle}]]  </span> </a>
                                <span style="font-size: 16px; color: #4e4e4e;">

                                    <th:block th:if="${!resume.bookmarkCheck}">
                                  <input type="button" class="bookmark" data-resume-no="[[${resume.resumeNo}]]" id="bookmark"
                                         value="♡" onclick="bookmarkToggle(this)">
                              </th:block>
                              <th:block th:if="${resume.bookmarkCheck}">
                                <input type="button" class="bookmark" data-resume-no="[[${resume.resumeNo}]]" id="bookmark"
                                       value="♥" onclick="bookmarkToggle(this)">
                              </th:block></span>
                          </div>

                            <div style="display: flex; gap: 15px; align-items: center;">
                              <div style="font-weight: bold; font-size: 16px" class="detail-info">[[${resume.username}]] |</div>
                              <div class="detail-info">[[${resume.career}]]</div>
                              <div class="detail-info">[[${resume.educationName}]]</div>
                              <div class="detail-info">[[${resume.salary}]]</div>
                            </div>

                            <div style="display: flex; gap: 5px;">
                              <th:block th:each="stack, iterStat : ${resume.stackList}">
                                <div class="stack" th:if="${iterStat.index < 5}" >[[${stack}]]</div>
                              </th:block>

                              <th:block th:if="${resume.stackList.size() > 5}">
                                <div class="stack">+[[${resume.stackList.size() - 5}]]</div>
                              </th:block>
                            </div>
                      </div>


              </div>
              <div style="display: flex; gap: 20px; margin-right: 30px; align-items: center">
                  <button th:onclick="'confirmToP(' + ${resume.applicationNo} + ', ' + ${resume.resumeNo} + ', this)'"
                          class="P">합격</button>
                  <button th:onclick="'confirmToF(' + ${resume.applicationNo} + ', ' + ${resume.resumeNo} + ', this)'"
                          class="F">불합격</button>
              </div>
        </div>
        <hr th:id="'hr-' + ${resume.resumeNo}">
    </th:block>
  </div>

</div>

<script src="/static/js/hyepin/application-resumeApply.js"></script>

</body>
</html>
